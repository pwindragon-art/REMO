<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REMO 카드 뉴스 생성기</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip (일괄 다운로드용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen p-4 sm:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- 헤더 -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">카드 뉴스 에디터</h1>
        <p class="text-xs text-slate-500 mt-1">템플릿을 선택하거나 이미지를 업로드하여 정방형(1080x1080) 카드 뉴스를 제작하세요.</p>
      </div>
      <div class="flex gap-2">
        <button id="btn-add-card" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold rounded-xl transition">
          + 새 슬라이드 추가
        </button>
        <button id="btn-download-all" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl transition">
          전체 다운로드 (ZIP)
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- 좌측 컨트롤러 (설정 패널) -->
      <section class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
        <!-- 1. 템플릿 선택 & 업로드 -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">1. 배경 템플릿 선택</label>
          <div class="grid grid-cols-4 gap-2 mb-3">
            <button class="tpl-btn h-14 rounded-lg bg-gradient-to-br from-orange-500 to-amber-500 border-2 border-transparent focus:border-slate-900" data-type="color" data-color="linear-gradient(135deg, #f97316, #f59e0b)"></button>
            <button class="tpl-btn h-14 rounded-lg bg-gradient-to-br from-slate-900 to-slate-800 border-2 border-transparent focus:border-slate-900" data-type="color" data-color="linear-gradient(135deg, #0f172a, #1e293b)"></button>
            <button class="tpl-btn h-14 rounded-lg bg-gradient-to-br from-blue-600 to-cyan-500 border-2 border-transparent focus:border-slate-900" data-type="color" data-color="linear-gradient(135deg, #2563eb, #06b6d4)"></button>
            <button class="tpl-btn h-14 rounded-lg bg-gradient-to-br from-emerald-600 to-teal-500 border-2 border-transparent focus:border-slate-900" data-type="color" data-color="linear-gradient(135deg, #059669, #14b8a6)"></button>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">사용자 템플릿 이미지 업로드</label>
            <input type="file" id="upload-bg" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100" />
          </div>
        </div>

        <hr class="border-slate-100" />

        <!-- 2. 제목 텍스트 및 스타일 -->
        <div class="space-y-3">
          <label class="block text-xs font-bold text-slate-700 uppercase">2. 제목 설정</label>
          <input type="text" id="input-title" placeholder="헤드라인 제목을 입력하세요" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:border-orange-500" value="새로운 비즈니스의 시작" />
          <div class="grid grid-cols-2 gap-3">
            <div>
              <span class="text-[11px] text-slate-500">글자 크기 (px)</span>
              <input type="range" id="size-title" min="20" max="80" value="48" class="w-full accent-orange-500" />
            </div>
            <div>
              <span class="text-[11px] text-slate-500">글자 색상</span>
              <input type="color" id="color-title" value="#ffffff" class="w-full h-8 p-0 border-0 rounded cursor-pointer" />
            </div>
          </div>
        </div>

        <hr class="border-slate-100" />

        <!-- 3. 내용 텍스트 및 스타일 -->
        <div class="space-y-3">
          <label class="block text-xs font-bold text-slate-700 uppercase">3. 본문 내용 설정</label>
          <textarea id="input-body" rows="4" placeholder="본문 내용을 입력하세요" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:border-orange-500 resize-none">우리는 실전 중심의 팀 프러너십을 통해 시장의 문제를 해결하고 지속 가능한 비즈니스를 창출합니다.</textarea>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <span class="text-[11px] text-slate-500">글자 크기 (px)</span>
              <input type="range" id="size-body" min="14" max="40" value="22" class="w-full accent-orange-500" />
            </div>
            <div>
              <span class="text-[11px] text-slate-500">글자 색상</span>
              <input type="color" id="color-body" value="#f1f5f9" class="w-full h-8 p-0 border-0 rounded cursor-pointer" />
            </div>
          </div>
        </div>

        <!-- 4. 정렬 및 카테고리 태그 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">상단 태그</label>
            <input type="text" id="input-tag" placeholder="예: ISSUE, NOTICE" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:border-orange-500" value="REMO INSIGHT" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">텍스트 정렬</label>
            <select id="select-align" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:border-orange-500">
              <option value="center">가운데 정렬</option>
              <option value="left">왼쪽 정렬</option>
              <option value="right">오른쪽 정렬</option>
            </select>
          </div>
        </div>
      </section>

      <!-- 우측 미리보기 및 슬라이드 목록 -->
      <section class="lg:col-span-7 space-y-4 flex flex-col items-center">
        <!-- 캔버스 컨테이너 (실제 1080x1080 비율 고정) -->
        <div class="relative w-full max-w-[480px] aspect-square bg-slate-900 rounded-2xl shadow-xl overflow-hidden border border-slate-300">
          <canvas id="card-canvas" width="1080" height="1080" class="w-full h-full object-contain"></canvas>
        </div>

        <!-- 현재 슬라이드 제어 버튼 -->
        <div class="flex items-center gap-3">
          <button id="btn-download-single" class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-xl shadow transition">
            현재 카드 단일 다운로드 (PNG)
          </button>
          <button id="btn-delete-card" class="px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs rounded-xl transition">
            현재 카드 삭제
          </button>
        </div>

        <!-- 슬라이드 썸네일 바 -->
        <div class="w-full bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-bold text-slate-600 mb-2">슬라이드 목록 (<span id="slide-count">1</span>개)</div>
          <div id="slide-tray" class="flex gap-3 overflow-x-auto pb-2">
            <!-- 썸네일이 동적으로 들어옵니다 -->
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // 상태 관리: 여러 슬라이드 저장 배열
    let slides = [
      {
        bgType: 'color',
        bgColor: 'linear-gradient(135deg, #f97316, #f59e0b)',
        bgImg: null,
        tag: 'REMO INSIGHT',
        title: '새로운 비즈니스의 시작',
        titleSize: 48,
        titleColor: '#ffffff',
        body: '우리는 실전 중심의 팀 프러너십을 통해 시장의 문제를 해결하고 지속 가능한 비즈니스를 창출합니다.',
        bodySize: 22,
        bodyColor: '#f1f5f9',
        align: 'center'
      }
    ];

    let currentSlideIdx = 0;
    const canvas = document.getElementById('card-canvas');
    const ctx = canvas.getContext('2d');

    // 입력 요소 매핑
    const el = {
      tag: document.getElementById('input-tag'),
      title: document.getElementById('input-title'),
      titleSize: document.getElementById('size-title'),
      titleColor: document.getElementById('color-title'),
      body: document.getElementById('input-body'),
      bodySize: document.getElementById('size-body'),
      bodyColor: document.getElementById('color-body'),
      align: document.getElementById('select-align'),
      uploadBg: document.getElementById('upload-bg'),
      tray: document.getElementById('slide-tray'),
      count: document.getElementById('slide-count')
    };

    // 폼과 현재 슬라이드 동기화
    function syncControlsToSlide() {
      const s = slides[currentSlideIdx];
      el.tag.value = s.tag;
      el.title.value = s.title;
      el.titleSize.value = s.titleSize;
      el.titleColor.value = s.titleColor;
      el.body.value = s.body;
      el.bodySize.value = s.bodySize;
      el.bodyColor.value = s.bodyColor;
      el.align.value = s.align;
    }

    // 캔버스 렌더링 함수
    function renderCard(targetCtx, s, width = 1080, height = 1080) {
      return new Promise((resolve) => {
        targetCtx.clearRect(0, 0, width, height);

        // 1. 배경 그리기
        if (s.bgType === 'img' && s.bgImg) {
          const img = new Image();
          img.onload = () => {
            targetCtx.drawImage(img, 0, 0, width, height);
            drawTexts();
            resolve();
          };
          img.src = s.bgImg;
        } else {
          // 그라디언트 채우기
          const grad = targetCtx.createLinearGradient(0, 0, width, height);
          if (s.bgColor.includes('#0f172a')) {
            grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e293b');
          } else if (s.bgColor.includes('#2563eb')) {
            grad.addColorStop(0, '#2563eb'); grad.addColorStop(1, '#06b6d4');
          } else if (s.bgColor.includes('#059669')) {
            grad.addColorStop(0, '#059669'); grad.addColorStop(1, '#14b8a6');
          } else {
            grad.addColorStop(0, '#f97316'); grad.addColorStop(1, '#f59e0b');
          }
          targetCtx.fillStyle = grad;
          targetCtx.fillRect(0, 0, width, height);
          drawTexts();
          resolve();
        }

        // 2. 텍스트 그리기
        function drawTexts() {
          const padding = 100;
          let textX = width / 2;
          if (s.align === 'left') textX = padding;
          if (s.align === 'right') textX = width - padding;

          targetCtx.textAlign = s.align;

          // 태그
          if (s.tag) {
            targetCtx.font = '700 28px sans-serif';
            targetCtx.fillStyle = s.titleColor;
            targetCtx.globalAlpha = 0.8;
            targetCtx.fillText(s.tag, textX, 220);
            targetCtx.globalAlpha = 1.0;
          }

          // 제목 (자동 줄바꿈)
          targetCtx.font = `800 ${s.titleSize * 1.5}px sans-serif`;
          targetCtx.fillStyle = s.titleColor;
          const titleLines = wrapText(targetCtx, s.title, width - padding * 2);
          let currentY = 320;
          titleLines.forEach(line => {
            targetCtx.fillText(line, textX, currentY);
            currentY += s.titleSize * 1.8;
          });

          // 구분선
          targetCtx.strokeStyle = s.titleColor;
          targetCtx.globalAlpha = 0.3;
          targetCtx.lineWidth = 2;
          targetCtx.beginPath();
          if (s.align === 'center') {
            targetCtx.moveTo(width / 2 - 80, currentY + 30);
            targetCtx.lineTo(width / 2 + 80, currentY + 30);
          } else if (s.align === 'left') {
            targetCtx.moveTo(padding, currentY + 30);
            targetCtx.lineTo(padding + 160, currentY + 30);
          } else {
            targetCtx.moveTo(width - padding - 160, currentY + 30);
            targetCtx.lineTo(width - padding, currentY + 30);
          }
          targetCtx.stroke();
          targetCtx.globalAlpha = 1.0;

          // 본문 (자동 줄바꿈)
          currentY += 100;
          targetCtx.font = `400 ${s.bodySize * 1.5}px sans-serif`;
          targetCtx.fillStyle = s.bodyColor;
          const bodyLines = wrapText(targetCtx, s.body, width - padding * 2);
          bodyLines.forEach(line => {
            targetCtx.fillText(line, textX, currentY);
            currentY += s.bodySize * 2.2;
          });
        }
      });
    }

    // 텍스트 자동 줄바꿈 계산 보조 함수
    function wrapText(context, text, maxWidth) {
      const words = text.split('\n');
      const lines = [];
      words.forEach(paragraph => {
        let currentLine = '';
        for (let i = 0; i < paragraph.length; i++) {
          const char = paragraph[i];
          const testLine = currentLine + char;
          const metrics = context.measureText(testLine);
          if (metrics.width > maxWidth && i > 0) {
            lines.push(currentLine);
            currentLine = char;
          } else {
            currentLine = testLine;
          }
        }
        lines.push(currentLine);
      });
      return lines;
    }

    // 메인 화면 갱신
    async function updatePreview() {
      await renderCard(ctx, slides[currentSlideIdx]);
      renderTray();
    }

    // 하단 썸네일 바 렌더링
    function renderTray() {
      el.tray.innerHTML = '';
      el.count.innerText = slides.length;

      slides.forEach((slide, idx) => {
        const thumb = document.createElement('div');
        thumb.className = `w-16 h-16 rounded-lg flex-shrink-0 cursor-pointer border-2 p-1 text-[10px] font-bold overflow-hidden flex flex-col justify-between ${idx === currentSlideIdx ? 'border-orange-500 bg-orange-50' : 'border-slate-200 bg-white'}`;
        thumb.innerHTML = `
          <span class="text-slate-400">#${idx + 1}</span>
          <span class="truncate text-slate-700">${slide.title || '제목 없음'}</span>
        `;
        thumb.onclick = () => {
          currentSlideIdx = idx;
          syncControlsToSlide();
          updatePreview();
        };
        el.tray.appendChild(thumb);
      });
    }

    // 이벤트 리스너 바인딩
    function bindInputs() {
      const updateData = () => {
        const s = slides[currentSlideIdx];
        s.tag = el.tag.value;
        s.title = el.title.value;
        s.titleSize = Number(el.titleSize.value);
        s.titleColor = el.titleColor.value;
        s.body = el.body.value;
        s.bodySize = Number(el.bodySize.value);
        s.bodyColor = el.bodyColor.value;
        s.align = el.align.value;
        updatePreview();
      };

      [el.tag, el.title, el.titleSize, el.titleColor, el.body, el.bodySize, el.bodyColor, el.align].forEach(elem => {
        elem.addEventListener('input', updateData);
      });

      // 프리셋 컬러 템플릿 선택
      document.querySelectorAll('.tpl-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = slides[currentSlideIdx];
          s.bgType = 'color';
          s.bgColor = btn.dataset.color;
          s.bgImg = null;
          updatePreview();
        });
      });

      // 사용자 템플릿 이미지 업로드
      el.uploadBg.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const s = slides[currentSlideIdx];
            s.bgType = 'img';
            s.bgImg = event.target.result;
            updatePreview();
          };
          reader.readAsDataURL(file);
        }
      });

      // 슬라이드 추가
      document.getElementById('btn-add-card').addEventListener('click', () => {
        slides.push({
          bgType: slides[currentSlideIdx].bgType,
          bgColor: slides[currentSlideIdx].bgColor,
          bgImg: slides[currentSlideIdx].bgImg,
          tag: 'REMO INSIGHT',
          title: `새 카드 제목 ${slides.length + 1}`,
          titleSize: 48,
          titleColor: '#ffffff',
          body: '여기에 본문 내용을 작성해 주세요.',
          bodySize: 22,
          bodyColor: '#f1f5f9',
          align: 'center'
        });
        currentSlideIdx = slides.length - 1;
        syncControlsToSlide();
        updatePreview();
      });

      // 슬라이드 삭제
      document.getElementById('btn-delete-card').addEventListener('click', () => {
        if (slides.length <= 1) {
          alert('최소 1장의 카드는 유지되어야 합니다.');
          return;
        }
        slides.splice(currentSlideIdx, 1);
        currentSlideIdx = Math.max(0, currentSlideIdx - 1);
        syncControlsToSlide();
        updatePreview();
      });

      // 단일 이미지 다운로드
      document.getElementById('btn-download-single').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `cardnews-${currentSlideIdx + 1}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      // 전체 ZIP 다운로드
      document.getElementById('btn-download-all').addEventListener('click', async () => {
        const zip = new JSZip();
        const offCanvas = document.createElement('canvas');
        offCanvas.width = 1080;
        offCanvas.height = 1080;
        const offCtx = offCanvas.getContext('2d');

        for (let i = 0; i < slides.length; i++) {
          await renderCard(offCtx, slides[i], 1080, 1080);
          const dataUrl = offCanvas.toDataURL('image/png');
          const base64Data = dataUrl.replace(/^data:image\/png;base64,/, '');
          zip.file(`cardnews-${i + 1}.png`, base64Data, { base64: true });
        }

        zip.generateAsync({ type: 'blob' }).then(content => {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(content);
          link.download = 'remo-cardnews-all.zip';
          link.click();
        });
      });
    }

    // 초기 실행
    syncControlsToSlide();
    bindInputs();
    updatePreview();
  </script>
</body>
</html>
